name: ci
# `dev` is where work lands: a push to it runs the checks, nothing more. Images are built and
# pushed for `main` only, and a pull request (dev → main is the usual one) builds them without pushing.
# A push that changes only docs/ or Markdown files at the top (README, ROADMAP) runs nothing: they are in no image
# and no test. Such a commit on main has no images of its own, so deploy/deploy.sh then deploys the images of the
# last commit before it that changed anything else; the two lists must stay the same. A pull request always runs:
# `check` is required on main, and a skipped workflow leaves a required check waiting for ever (PR #25).
on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:

# docs/35 R-20: the runs of pushes to main go one after the other, in the order of the pushes, from their first job
# on. The group on the `images` job alone was entered only after `check`, so of two pushes close together the older
# could be checked last, build last and leave `latest` on the older commit. Every other run (dev, a pull request)
# gets a group of its own, which is no group at all.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

# The token every job gets reads the repository and nothing else; a job that pushes an image says so in its own block.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 2.1.0: every mod both sides need is on PCs (lock sides, Modrinth, jar channels, the server's last start)
      - run: pnpm --filter modpack cli check-sides

  # Images are built here and only here; the VPS pulls them (deploy/deploy.sh). A pull request builds them too, so a
  # branch's `next build` is proven before it reaches main, but only main pushes them to the registry.
  images:
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # docs/31 B-08: one image build per branch and app at a time, in the order of the pushes, so an older run can
    # never finish last and leave `latest` on an older commit. A pull request's older run is simply cancelled.
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepslate-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: stamp
        run: echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # a pull request's image is kept locally for the check below
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}
      # The footer's version must be the stamped one: the built image carries this commit (planner, 2026-10-01)
      - name: image carries its commit
        if: github.event_name == 'pull_request'
        run: |
          got=$(docker run --rm --memory=512m --entrypoint node "${{ steps.names.outputs.image }}:${{ github.sha }}" -e 'process.stdout.write(process.env.PORTAL_COMMIT || "")')
          echo "PORTAL_COMMIT=$got"
          test "$got" = "${{ github.sha }}"
