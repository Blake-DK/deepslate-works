name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 2.1.0: every mod both sides need is on PCs (lock sides, Modrinth, jar channels, the server's last start)
      - run: pnpm --filter modpack cli check-sides

  # Images are built here and only here; the VPS pulls them (deploy/deploy.sh). A pull request builds them too, so a
  # branch's `next build` is proven before it reaches main, but only main pushes them to the registry.
  images:
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepslate-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: stamp
        run: echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # a pull request's image is kept locally for the check below
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}
      # The footer's version must be the stamped one: the built image carries this commit (planner, 2026-10-01)
      - name: image carries its commit
        if: github.event_name == 'pull_request'
        run: |
          got=$(docker run --rm --memory=512m --entrypoint node "${{ steps.names.outputs.image }}:${{ github.sha }}" -e 'process.stdout.write(process.env.PORTAL_COMMIT || "")')
          echo "PORTAL_COMMIT=$got"
          test "$got" = "${{ github.sha }}"
