name: dev-images
# docs/42 §5.3 (2026-10-10): the test site follows `dev`, the live site follows `main`. A push to dev that changes
# something an image is made of builds both images, tagged with the commit and with the moving tag `dev`; on the VPS
# `sudo deploy/test-up.sh` pulls `dev` and starts the test pair on it. Live never runs `dev`: deploy/deploy.sh pulls
# main's images by the commit's sha only (ci.yml builds those; this file leaves ci.yml as it was).
#
# Not started by a push that changes only docs, the Markdown files at the top, deploy/, tools/ or the other
# workflows: no image reads them (the designer runs tools/designer from a mount, deploy/ is the host's). The filter is
# on the trigger, not in a job, so such a push starts no run and cancels nothing.
# Any other ref: test-images.yml, by hand.
on:
  push:
    branches: [dev]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!deploy/**"
      - "!tools/**"
      - "!.github/**"
      - ".github/workflows/dev-images.yml"

# a newer push to dev cancels the run of an older one that is still going: `dev` ends on the newest push
concurrency:
  group: dev-images
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepslate-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A commit that already has images (main's merge commit, after dev took main in by a fast-forward, or a run
      # started again) is never built a second time: `dev` is moved onto those images. So a dev run never replaces an
      # image a live deploy pulls by its sha.
      - id: have
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.image }}:${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "${{ github.sha }} already has an image: dev is moved onto it, nothing is built"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have.outputs.exists == '1'
        run: docker buildx imagetools create --tag "${{ steps.names.outputs.image }}:dev" "${{ steps.names.outputs.image }}:${{ github.sha }}"
      - if: steps.have.outputs.exists == '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.have.outputs.exists == '0'
        id: stamp
        run: echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - if: steps.have.outputs.exists == '0'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built }}
          # never `latest`: that tag is main's (ci.yml)
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # reads main's cache and writes none, so dev builds never push main's out of the 10 GB
          cache-from: type=gha,scope=${{ matrix.app }}
