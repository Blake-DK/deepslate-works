name: installer
# The Windows app, on a real Windows runner (never on the VPS). Runs only when the installer changes: Windows minutes
# cost double on a private repository.
on:
  push:
    branches: [main]
    paths: [installer/**, branding/launcher/**, .github/workflows/installer.yml]
  pull_request:
    paths: [installer/**, branding/launcher/**, .github/workflows/installer.yml]
  workflow_dispatch:

# docs/35 R-20: the runs of pushes to main go one after the other, in the order of the pushes, so the image's moving
# tags (the version and `latest`) end on the newest push; `publish` had no order at all. A pull request or a run
# started by hand gets a group of its own, which is no group at all.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'installer-main' || format('installer-{0}', github.run_id) }}
  cancel-in-progress: false

# The token every job gets reads the repository and nothing else; a job that pushes an image says so in its own block.
permissions:
  contents: read

jobs:
  # 2.0.x: the PowerShell app. Its self test runs where it was written for, pwsh on Linux (it pretends Windows with
  # scratch files); the window then on a real Windows desktop: Setup.bat's hand-over, no console window, in front,
  # started again, the shim's arguments; pictures and the log are kept as the run's artifact.
  powershell-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self test (pwsh)
        run: pwsh -NoProfile -File installer/DeepslateWorks.ps1 -SelfTest

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The window on a Windows desktop
        timeout-minutes: 8
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/tests/windows-smoke.ps1 -Out shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installer-2-windows
          path: shots
          if-no-files-found: ignore

  # 3.0: Deepslate Works as a Windows app, DeepslateWorks.exe (.NET Framework 4.8, WPF, one file). Built and tested
  # here only, never on the VPS; the version is installer/VERSION, the site's address is built in. Then the first run
  # from a fresh download on the runner's desktop, with pictures.
  app:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content installer/VERSION -Raw).Trim()
          if ($v -notmatch '^\d{1,4}(\.\d{1,4}){1,3}$') { throw "installer/VERSION is not a version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      # The site's address is the secret PORTAL_URL, so it is in neither the repository nor the logs. Without it the
      # csproj's placeholder is built in: fine for a check, never for main, whose exe players download.
      - name: Build DeepslateWorks.exe
        shell: pwsh
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          if (-not $env:PORTAL_URL -and '${{ github.event_name }}' -eq 'push') { throw "the secret PORTAL_URL is not set; main's exe must carry the site's address" }
          dotnet build installer/app/DeepslateWorks.csproj -c Release -o out "-p:PortalUrl=$env:PORTAL_URL"
      - name: The exe, its checksum and version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item out/DeepslateWorks.exe publish/
          $f = Get-Item publish/DeepslateWorks.exe
          $v = $f.VersionInfo.ProductVersion
          if (-not $v.StartsWith("${{ steps.v.outputs.version }}")) { throw "the exe says $v, installer/VERSION says ${{ steps.v.outputs.version }}" }
          $sum = (Get-FileHash publish/DeepslateWorks.exe -Algorithm SHA256).Hash.ToLower()
          "$sum  DeepslateWorks.exe" | Set-Content -NoNewline publish/DeepslateWorks.exe.sha256
          "${{ steps.v.outputs.version }}" | Set-Content -NoNewline publish/VERSION
          "DeepslateWorks.exe ${{ steps.v.outputs.version }}: {0:N0} bytes ({1:N2} MB), sha256 {2}" -f $f.Length, ($f.Length / 1MB), $sum | Tee-Object -FilePath publish/SUMMARY.txt
          Get-Content publish/SUMMARY.txt >> $env:GITHUB_STEP_SUMMARY
      - name: First run from a fresh download, on a Windows desktop
        if: success() || failure()
        timeout-minutes: 10
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/tests/windows-smoke-3.ps1 -Exe publish/DeepslateWorks.exe -Out shots
      # 3.6.1: the Play tab and the Test tab in the app's own window against a stand-in site on 127.0.0.1, opened four
      # ways (desktop, the Play link, live switched off, a member), pictures side by side and both game folders listed
      # before and after each kind of run. PORTAL_URL only so that no kept file can name the real site.
      - name: The Play tab and the Test tab, in the app's own window
        if: success() || failure()
        timeout-minutes: 20
        shell: powershell
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/tests/windows-tabs.ps1 -Exe publish/DeepslateWorks.exe -Out shots
      - name: Tests (the self test, ported)
        if: success() || failure()
        timeout-minutes: 10
        shell: pwsh
        run: dotnet test installer/tests/DeepslateWorks.Tests/DeepslateWorks.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory shots/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deepslate-works-${{ steps.v.outputs.version }}
          path: |
            publish
            shots
          if-no-files-found: ignore

  # 3.6.1, the reopening day: the real app 3.5.5 (built from 04c0e59f, whose app code is the 3.5.5 players have)
  # updates itself to this build against a stand-in site, then plays. Both exes carry the stand-in's address
  # (http://127.0.0.1:47555): an app that updates itself restarts without -Root. Run by hand only.
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: This app and 3.5.5, both pointed at the stand-in site
        shell: pwsh
        run: |
          dotnet build installer/app/DeepslateWorks.csproj -c Release -o new "-p:PortalUrl=http://127.0.0.1:47555"
          git -c advice.detachedHead=false worktree add old355 04c0e59f
          dotnet build old355/installer/app/DeepslateWorks.csproj -c Release -o old "-p:PortalUrl=http://127.0.0.1:47555"
      - name: 3.5.5 updates itself and plays, in its own window
        timeout-minutes: 15
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/tests/windows-update.ps1 -Old old/DeepslateWorks.exe -New new/DeepslateWorks.exe -Out shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: update-from-3.5.5
          path: shots
          if-no-files-found: ignore

  # main only: the exe as a tiny image (FROM scratch: the exe, its .sha256, VERSION) that deploy/deploy.sh copies into
  # dist/ci; Admin -> Build (installer) then hands it out. Tagged with the version, the commit and latest.
  publish:
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deepslate-works-*
          merge-multiple: true
      - name: Image
        run: |
          set -eu
          v=$(cat publish/VERSION)
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepslate-installer"
          printf 'FROM scratch\nCOPY DeepslateWorks.exe DeepslateWorks.exe.sha256 VERSION /\n' > publish/Dockerfile
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -t "$img:$v" -t "$img:${{ github.sha }}" -t "$img:latest" publish
          docker push --all-tags "$img"
