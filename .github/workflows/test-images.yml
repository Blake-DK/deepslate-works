name: test-images
# docs/42 §5.3: the images of the test server's copy of the site (web-test, api-test). `dev` builds no images on a push
# (ci.yml, the Actions minutes), so this runs by hand only: Actions → test-images → Run workflow, on the ref asked for
# (dev by default). Both images are tagged `test` and with the commit; deploy/deploy.sh never pulls them, only
# `sudo deploy/test-up.sh` does. A run costs about what one push to main costs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (dev by default)"
        required: true
        default: dev

# one run at a time, so `test` is always the images of the run that finished last and was started last
concurrency:
  group: test-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepslate-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # the commit the images are made of: the test site's footer compares it with the test checkout's
          build-args: |
            GIT_SHA=${{ steps.names.outputs.sha }}
            BUILT_AT=${{ steps.names.outputs.built }}
          # never `latest`: that tag is main's (ci.yml)
          tags: |
            ${{ steps.names.outputs.image }}:test
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.names.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
