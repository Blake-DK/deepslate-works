# Deepslate Works on vps-01v. `web` joins the shared proxy network; Caddy (stack web-proxy)
# terminates TLS. The WireGuard tunnel to the AMP host lives in its own container on the
# `internal` network only; `api` and the inner map relay share its namespace (docs/13 §3).
# The only published port is UDP 51820 (WireGuard).
#
# `web` and `api` are built by CI (.github/workflows/ci.yml) and pulled from GHCR. They have no build
# section on purpose: this host must never build images (it ran out of memory doing so on 2026-09-29).
# Deploy with deploy/deploy.sh. Every service carries a memory limit.
#
# Dockhand holds a mirror of this file and of deploy/.env (stack `deepslate`, environment VPS-01V) and runs
# it from /data/stacks/deepslate, so every host path goes through DEEPSLATE_DIR (absolute, set in deploy/.env).
# deploy.sh refreshes the mirror after each deploy; edit here, never in Dockhand.
name: deepslate

# docs/31 B-21: without this the json-file logs grow without end (api writes a line for every AMP poll).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  web:
    external: true
  internal:

services:
  postgres:
    image: postgres:16-alpine
    container_name: deepslate-db
    restart: unless-stopped
    logging: *logging
    # Started as the image's own postgres user (70), which owns the data folder, so the entrypoint never needs root
    # to chown or switch users and the container keeps no Linux capabilities. A fresh data folder must be made 70:70
    # (or 70:0) with mode 700 before the first start.
    user: "70:70"
    cap_drop: [ALL]
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=128MB"]
    networks: [internal]
    environment:
      POSTGRES_USER: deepslate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deepslate
    volumes:
      - /root/docker/deepslate/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepslate -d deepslate"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-web
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]                     # runs as an unprivileged user and needs no Linux capabilities
    mem_limit: 768m
    networks: [web, internal]
    # docs/31 B-18: the internet-facing container gets the variables it reads and no others. It used to get all of
    # deploy/.env, the AMP password, the bot token and the webhooks included. A new variable for web goes here,
    # in apps/web/src/env.ts and in .env.example.
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate
      AUTH_SECRET: ${AUTH_SECRET}
      TOTP_SEAL_KEY: ${TOTP_SEAL_KEY:-}
      AUTH_URL: ${AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_GUILD_AUTO_JOIN: ${DISCORD_GUILD_AUTO_JOIN:-0}
      API_URL: ${API_URL}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      MANIFEST_KEY: ${MANIFEST_KEY:-}
      MAP_URL: ${MAP_URL:-}
      SERVER_ADDRESS: ${SERVER_ADDRESS:?SERVER_ADDRESS is the address players join; set it in deploy/.env}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-deepslate-works/0.1}
      # docs/39: the build designer, when it is set up (deploy.sh starts the `designer` service only then)
      DESIGNER_URL: ${DESIGNER_URL:-}
      DESIGNER_TOKEN: ${DESIGNER_TOKEN:-}
      DESIGNER_DAILY: ${DESIGNER_DAILY:-80}
      # docs/42: the test server's card on Control Room and the Live | Test switch, for admins; nothing unless TEST_STACK=1.
      # The summary token opens GET /test/summary on api-test and nothing else.
      TEST_STACK: ${TEST_STACK:-0}
      TEST_SITE_URL: ${TEST_AUTH_URL:-}
      TEST_API_URL: http://deepslate-wg:4001
      TEST_SUMMARY_TOKEN: ${TEST_SUMMARY_TOKEN:-}
      TEST_APP_TOKEN: ${TEST_APP_TOKEN:-}   # docs/45: the launcher's Test section (live web and api-test only)
    volumes:
      # The manifest is edited by "apply results" and committed, so the live repo's modpack/ and .git are mounted.
      # Nothing else from the repo (no .env, no keys) is visible to the internet-facing container.
      - ${DEEPSLATE_DIR:-..}/modpack:/repo/modpack
      - ${DEEPSLATE_DIR:-..}/.git:/repo/.git
      - ${DEEPSLATE_DIR:-..}/dist:/repo/dist:ro         # built packs, served under /downloads (api builds them)
      - ${DEEPSLATE_DIR:-..}/data:/repo/data            # uploaded pictures (Admin → Branding); not in git
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # web and its database only, never the designer or api: waiting on them made web "unhealthy" (2026-10-07)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  wireguard:
    # docs/31 B-22: pinned to the image that was running on 2026-10-04 (read with docker image inspect, docs/11),
    # so neither a deploy nor Dockhand's redeploy can swap the tunnel's image unasked. To update on purpose: pull
    # the new tag, read its digest, change it here, deploy on a quiet night.
    image: lscr.io/linuxserver/wireguard@sha256:216ca1ce9da7bfe26fb752111d952487804bd18933bbd4794970d424bf8adfe9
    container_name: deepslate-wg
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
    volumes:
      - ${DEEPSLATE_DIR:-..}/deploy/wireguard:/config          # wg_confs/wg0.conf (git-ignored)
    ports:
      - 51820:51820/udp
    networks: [internal]             # never on `web`
    healthcheck:
      test: ["CMD", "ping", "-c1", "-W2", "10.77.0.2"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-api
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]                     # runs as an unprivileged user and needs no Linux capabilities
    mem_limit: 512m                     # also the cap for `modpack build`, which runs as a child of api
    network_mode: "service:wireguard"   # reachable as deepslate-wg:4000 on `internal` only
    # Like web, api gets the variables it reads (apps/api/src/env.ts) and no others: not the session secret, the
    # database password on its own, the OAuth secret or the manifest key. A new variable for api goes here, in env.ts
    # and in .env.example. Empty means unset (env.ts then takes its default).
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate
      PORTAL_URL: ${AUTH_URL}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      AMP_URL: ${AMP_URL:-}
      AMP_INSTANCE_ID: ${AMP_INSTANCE_ID:-}
      AMP_USERNAME: ${AMP_USERNAME:-}
      AMP_PASSWORD: ${AMP_PASSWORD:-}
      AMP_MOCK: ${AMP_MOCK:-}
      AMP_TUNNEL_IP: ${AMP_TUNNEL_IP:-}
      ROUTER_DASH_URL: ${ROUTER_DASH_URL:-}
      # Admin → Server → Router never removes the route players join by; without it here, that guard is off
      SERVER_ADDRESS: ${SERVER_ADDRESS:-}
      RSYNC_TARGET: ${RSYNC_TARGET:-}
      DEPLOY_KEY_PATH: ${DEPLOY_KEY_PATH:-}
      LIMBO_POS: ${LIMBO_POS:-}
      SPAWN_POS: ${SPAWN_POS:-}
      # docs/42a: this api is the one instance that talks to the players' Discord (the bot and the webhooks below).
      # No other service sets it; without it an api is silent on Discord (apps/api/src/discord/gate.ts).
      DISCORD_TALKS: "1"
      DISCORD_PLAYER_ROLE_ID: ${DISCORD_PLAYER_ROLE_ID:-}   # the Minecraft role on everyone who plays; empty: off
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_WEBHOOK_FEED: ${DISCORD_WEBHOOK_FEED:-}
      DISCORD_WEBHOOK_ADMIN: ${DISCORD_WEBHOOK_ADMIN:-}
      DISCORD_WEBHOOK_UPDATES: ${DISCORD_WEBHOOK_UPDATES:-}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-}
      GEOIP_DB: ${GEOIP_DB:-}
      BACKUP_PUBLIC_KEY: ${BACKUP_PUBLIC_KEY:-}
    volumes:
      # the deploy key, and known_hosts beside it once it has been made (B-23: the AMP host's key is then pinned)
      - ${DEEPSLATE_DIR:-..}/deploy/keys:/run/keys:ro
      # the nightly database dumps; api copies the newest to the AMP host (docs/28 §4.7, apps/api/src/backup/dump-push.ts)
      - /root/docker/deepslate/backups:/dbdumps:ro
      - ${DEEPSLATE_DIR:-..}/dist:/repo/dist             # `modpack build` writes it (owner uid 1000); sync-server rsyncs dist/server/ to the AMP host
      - ${DEEPSLATE_DIR:-..}/modpack:/repo/modpack:ro
      - ${DEEPSLATE_DIR:-..}/installer:/repo/installer:ro
      - ${DEEPSLATE_DIR:-..}/data/news:/repo/data/news:ro   # docs/21: news pictures go to Discord as attachments
      - ${DEEPSLATE_DIR:-..}/data/builds:/repo/data/builds:ro # docs/34 §10: builds an admin uploaded; `modpack build` makes their datapack
      # country lookup for the analytics page: MaxMind's GeoLite2-Country, kept current by the web-proxy stack
      - ${GEOIP_DIR:-/root/docker/web-proxy/geoip}:/geoip:ro
    depends_on:
      wireguard:
        condition: service_started
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy     # web applies the database migrations when it starts; api needs them done
    security_opt:
      - no-new-privileges:true
    # docs/31 B-09: api answers. Whether it reaches the AMP host is in the answer and is checked by deploy.sh.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --header=\"Authorization: Bearer $$API_SERVICE_TOKEN\" http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  map-relay-inner:
    image: alpine/socat@sha256:82ad20f6f6e29b91ff33b6662d24063522b1378f08fd8569cd3ab412cac13f50
    container_name: deepslate-map-relay-inner
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 32m
    network_mode: "service:wireguard"
    command: TCP-LISTEN:8100,fork,reuseaddr TCP:10.77.0.2:8100
    depends_on: [wireguard]

  map-relay-outer:
    image: alpine/socat@sha256:82ad20f6f6e29b91ff33b6662d24063522b1378f08fd8569cd3ab412cac13f50
    container_name: deepslate-map-relay-outer
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 32m
    networks: [web, internal]
    command: TCP-LISTEN:8100,fork,reuseaddr TCP:deepslate-wg:8100
    depends_on: [map-relay-inner]

  # docs/39 Step 1: the build designer. The host's CLI, run by tools/designer/server.mjs as the designer's own host
  # user, signed in on Alex's plan. Profile `designer`: deploy.sh starts it only while DESIGNER_CMD is set in
  # deploy/.env, and removes it when that is emptied. On `internal` only, no published port: web reaches it as
  # deepslate-designer:4100 with DESIGNER_TOKEN. The CLI gets no tools and only HOME and PATH of the environment.
  # The user's home is mounted read-write (the login and the CLI's own settings file are written back there when a
  # token is refreshed); the CLI's program folders inside it are mounted again read-only over it, so it cannot change
  # itself. The defaults only keep `docker compose` working while the variables are unset.
  designer:
    profiles: [designer]
    image: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    container_name: deepslate-designer
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 768m                     # the CLI used under 300 MB in each call of Step 0.4
    user: "${DESIGNER_UID:-65534}:${DESIGNER_GID:-65534}"
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]                # never on `web`
    working_dir: /tmp
    command: ["node", "/designer/server.mjs"]
    environment:
      HOME: ${DESIGNER_HOME:-/nonexistent}
      PATH: ${DESIGNER_BIN_DIR:-/nonexistent}:/usr/local/bin:/usr/bin:/bin
      DISABLE_AUTOUPDATER: "1"
      DESIGNER_CMD: ${DESIGNER_CMD:-}
      DESIGNER_MODEL: ${DESIGNER_MODEL:-}
      DESIGNER_TOKEN: ${DESIGNER_TOKEN:-}
      DESIGNER_CREDENTIALS: ${DESIGNER_CREDENTIALS:-}
      DESIGNER_DAILY: ${DESIGNER_DAILY:-80}   # the designer keeps its own count too (tools/designer/server.mjs)
      DESIGNER_DATA: /designer-data
    volumes:
      - ${DEEPSLATE_DIR:-..}/tools/designer:/designer:ro          # server.mjs and the instructions; web cannot write here
      # blocks.json. web CAN write this: it mounts modpack/ read-write (above). server.mjs takes only plain ids, known
      # kinds and plain property values from it, and drops anything else (blockListText).
      - ${DEEPSLATE_DIR:-..}/modpack/designer:/designer-data:ro
      - ${DESIGNER_HOME:-/nonexistent}:${DESIGNER_HOME:-/nonexistent}
      - ${DESIGNER_BIN_DIR:-/nonexistent/bin}:${DESIGNER_BIN_DIR:-/nonexistent/bin}:ro
      - ${DESIGNER_VERSIONS_DIR:-/nonexistent/versions}:${DESIGNER_VERSIONS_DIR:-/nonexistent/versions}:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4100, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  # docs/42: the test server's own copy of the site, hidden from players. Profile `test`: deploy.sh starts both only
  # while TEST_STACK=1 is in deploy/.env and removes them when it is not. Their images are built by CI on each push to `dev`
  # (.github/workflows/dev-images.yml, tag `dev`; another ref by hand with test-images.yml, tag `test`), chosen by
  # TEST_IMAGE_TAG and pulled by deploy/test-up.sh, never by a live deploy.
  # Every host path is the test checkout's (TEST_DIR), so nothing the test site builds lands in the live dist/.
  # The defaults only keep `docker compose config` working while the TEST_ variables are unset.
  web-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-web:${TEST_IMAGE_TAG:-dev}
    pull_policy: missing                # deploy/test-up.sh pulls; a live deploy never waits on a test image
    container_name: deepslate-web-test
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 512m
    networks: [web, internal]           # Caddy reaches it on `web`, after the live site's admin check (Caddyfile.snippet)
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate_test
      AUTH_SECRET: ${TEST_AUTH_SECRET:-}
      AUTH_URL: ${TEST_AUTH_URL:-https://test.deepslate.dsw.test}
      # no COOKIE_DOMAIN: its session cookie is its own host's, under a name of its own (TEST_MODE, docs/42 T2)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_GUILD_AUTO_JOIN: "0"      # anyone but the admin needs an invite made on the test site
      API_URL: http://deepslate-wg:4001
      API_SERVICE_TOKEN: ${TEST_API_SERVICE_TOKEN:-}
      SERVER_ADDRESS: ${TEST_SERVER_ADDRESS:-lab.dsw.test}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-deepslate-works/0.1}
      TEST_MODE: "1"
      LIVE_SITE_URL: ${AUTH_URL}
      LIVE_MODPACK_DIR: /live-modpack
    volumes:
      # no .git: the test site never writes to git (docs/42 T3); modpack/ is read only for the same reason
      - ${TEST_DIR:-/nonexistent}/modpack:/repo/modpack:ro
      - ${TEST_DIR:-/nonexistent}/dist:/repo/dist:ro
      - ${TEST_DIR:-/nonexistent}/data:/repo/data
      # docs/42 T4: the pack the live site hands out, to warn when the test server's differs from what PCs have
      - ${DEEPSLATE_DIR:-..}/modpack:/live-modpack:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-api:${TEST_IMAGE_TAG:-dev}
    pull_policy: missing
    container_name: deepslate-api-test
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 384m                     # also the cap for a test Build, which runs as a child of api
    network_mode: "service:wireguard"   # the same tunnel; deepslate-wg:4001 on `internal`
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate_test
      PORT: "4001"
      PORTAL_URL: ${TEST_AUTH_URL:-https://test.deepslate.dsw.test}
      API_SERVICE_TOKEN: ${TEST_API_SERVICE_TOKEN:-}
      AMP_URL: ${AMP_URL:-}
      AMP_INSTANCE_ID: ${TEST_AMP_INSTANCE_ID:-}
      AMP_USERNAME: ${TEST_AMP_USERNAME:-}
      AMP_PASSWORD: ${TEST_AMP_PASSWORD:-}
      AMP_MOCK: ${TEST_AMP_MOCK:-}
      AMP_TUNNEL_IP: ${AMP_TUNNEL_IP:-}
      ROUTER_DASH_URL: ${ROUTER_DASH_URL:-}   # read only from the test server (routes/router.ts)
      SERVER_ADDRESS: ${TEST_SERVER_ADDRESS:-}
      RSYNC_TARGET: ${TEST_RSYNC_TARGET:-}
      DEPLOY_KEY_PATH: /run/keys/deploy.key   # the test key: rrsync-rooted at the test instance's Minecraft/
      LIMBO_POS: ${LIMBO_POS:-}
      SPAWN_POS: ${SPAWN_POS:-}
      # docs/42a (2026-10-08): silent on Discord. No DISCORD_TALKS, so no bot and none of the players' webhooks even if
      # they were set here; only a private channel's, when TEST_DISCORD_WEBHOOK_* are set in deploy/.env (empty: silent).
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}   # read only: the door's "still in the Discord server" check
      DISCORD_PRIVATE_WEBHOOK_FEED: ${TEST_DISCORD_WEBHOOK_FEED:-}
      DISCORD_PRIVATE_WEBHOOK_ADMIN: ${TEST_DISCORD_WEBHOOK_ADMIN:-}
      DISCORD_PRIVATE_WEBHOOK_UPDATES: ${TEST_DISCORD_WEBHOOK_UPDATES:-}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-}
      GEOIP_DB: ${GEOIP_DB:-}
      TEST_MODE: "1"
      TEST_SUMMARY_TOKEN: ${TEST_SUMMARY_TOKEN:-}
      TEST_APP_TOKEN: ${TEST_APP_TOKEN:-}   # docs/45: the launcher's Test section (live web and api-test only)
      SEASONS_SHIP: ${TEST_SEASONS_SHIP:-}
    volumes:
      - ${DEEPSLATE_DIR:-..}/deploy/keys-test:/run/keys:ro
      - ${TEST_DIR:-/nonexistent}/dist:/repo/dist
      - ${TEST_DIR:-/nonexistent}/modpack:/repo/modpack:ro
      - ${TEST_DIR:-/nonexistent}/installer:/repo/installer:ro
      - ${TEST_DIR:-/nonexistent}/data/news:/repo/data/news:ro
      - ${TEST_DIR:-/nonexistent}/data/builds:/repo/data/builds:ro
      # the checkout's commit, for the footer and the live card (test-mode/checkout.ts reads HEAD; nothing runs git)
      - ${TEST_DIR:-/nonexistent}/.git:/repo/.git:ro
      - ${GEOIP_DIR:-/root/docker/web-proxy/geoip}:/geoip:ro
    depends_on:
      wireguard:
        condition: service_started
      postgres:
        condition: service_healthy
      web-test:
        condition: service_healthy     # web-test applies the test database's migrations when it starts
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --header=\"Authorization: Bearer $$API_SERVICE_TOKEN\" http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  backups:
    image: postgres:16-alpine
    container_name: deepslate-backups
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 64m
    networks: [internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /root/docker/deepslate/backups:/backups
      # One file, so the container keeps the script it was started with when git replaces it; deploy/deploy.sh
      # compares the two after `up` and restarts this container when they differ (docs/35 R-19).
      - ${DEEPSLATE_DIR:-..}/deploy/backup-loop.sh:/backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Nightly pg_dump at 00:00 UTC to deepslate-YYYY-MM-DD.sql.gz, the newest 14 kept, a failed dump tried again
    # after ten minutes (deploy/backup-loop.sh; docs/31 B-20). pre-* dumps are never counted or removed.
    command: ["sh", "/backup-loop.sh"]
