# Deepslate Works on docker-01v (planner doc 62): the home stack, published through Pangolin.
#
# No WireGuard: api reaches the AMP host over the LAN. No published ports, no Docker socket. The site's newt (Pangolin's
# tunnel client) is the service `newt` below, on the network ds-edge, where it meets deepslate-caddy by that name.
# deepslate-firewall on the host gates the four networks by their bridge names (ds-edge, ds-web, ds-amp, ds-internal),
# so the names below are part of the contract:
#   ds-edge      the newt and caddy: Pangolin's tunnel only              ds-amp       api, the map relay: the AMP host's
#   ds-web       caddy, web, the map relay: public https only                          four ports and the internet
#   ds-internal  web, api, postgres, backups: no outside access at all
#
# Every image is built by CI and pulled from GHCR (`latest`, or IMAGE_TAG); this host never builds one. Every service
# carries a memory limit. Two roots, both absolute in the stack's .env: DEEPSLATE_DIR, the checkout (modpack/, .git,
# deploy/keys) and DEEPSLATE_DATA, the data (postgres/, backups/, data/, dist/, geoip/, caddy/).
#
# Updating: Redeploy in Dockhand, which keeps its own copy of this file and the .env (deploy/home/README.md), pulls every image and
# runs the one-shot steps below before the site starts: init (folders and owners), repo-sync (the checkout brought
# forward), db-prep (a dump, then the test database if missing), migrate, and installer (the exe into dist/ci). The
# database image upgrades its data to a new PostgreSQL by itself (deploy/images/db). COMPOSE_PROFILES in the env file
# turns on the designer, geoip and test services. A change to this file itself is read on the redeploy after the one
# whose repo-sync pulled it, and only once it is pasted into Dockhand's copy.
name: deepslate

# docs/31 B-21: without this the json-file logs grow without end (api writes a line for every AMP poll).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  ds-edge:
    external: true                      # made once before the stack (docker network create, bridge ds-edge): it outlives a compose down
  ds-web:
    driver_opts:
      com.docker.network.bridge.name: ds-web
  ds-amp:
    driver_opts:
      com.docker.network.bridge.name: ds-amp
  ds-internal:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: ds-internal

services:
  # The one-shot steps of a redeploy, in this order: init, then repo-sync and installer, db-prep once the database is
  # up, then migrate. Compose removes the old containers before these run, so a step that fails leaves every service
  # after it stopped: db-prep and migrate fail only where going on would be worse; init and repo-sync say what they
  # refused and go on. Each exits when done; `docker compose ps -a` and its log show what it did.
  init:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-ops:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-init
    restart: "no"
    logging: *logging
    user: "0:0"                         # the folders have four owners; root with only the three capabilities it needs
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 32m
    network_mode: none
    command: ["sh", "/usr/local/lib/deepslate/init.sh"]
    volumes:
      - ${DEEPSLATE_DATA:?DEEPSLATE_DATA is the data root; set it in the stack's .env}:/data
      - ${DEEPSLATE_DIR:?DEEPSLATE_DIR is the checkout; set it in the stack's .env}/deploy/keys:/keys
    security_opt:
      - no-new-privileges:true

  # The checkout to the branch it follows (main; dev for the dry run), as its owner, with the guards deploy.sh had:
  # .git/config and .git/hooks must match the copies under /root that web cannot reach (deploy/README.md). Commits made
  # here and not pushed, a guard that does not match, or a fetch that fails: it says so in its log and the stack starts
  # on the checkout as it was. On ds-web: GitHub over https, nothing private. The repository is public: no credentials.
  repo-sync:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-ops:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-repo-sync
    restart: "no"
    logging: *logging
    user: "${DEEPSLATE_UID:-1000}:${DEEPSLATE_GID:-1000}"   # the checkout's owner
    cap_drop: [ALL]
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    networks: [ds-web]
    environment:
      HOME: /tmp
      SYNC_BRANCHES: main dev
      GIT_CONFIG_EXPECTED: /guard/git-config.expected
      GIT_HOOKS_EXPECTED: /guard/git-hooks.expected
    command: ["sh", "/usr/local/lib/deepslate/repo-sync.sh"]
    volumes:
      - ${DEEPSLATE_DIR}:/repo
      - ${GIT_GUARD_DIR:-/root/.config/deepslate}/git-config.expected:/guard/git-config.expected:ro
      - ${GIT_GUARD_DIR:-/root/.config/deepslate}/git-hooks.expected:/guard/git-hooks.expected:ro
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # docs/31 B-19: a dump before the migrations (pre-deploy-*.sql.gz beside the nightly dumps, the newest 10 kept), and
  # the test database when the test server is on and it is missing (docs/42 §5.2). A dump that fails stops here.
  db-prep:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-backups:latest
    pull_policy: always
    container_name: deepslate-db-prep
    restart: "no"
    logging: *logging
    user: "70:70"
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [ds-internal]
    environment:
      PGHOST: postgres
      PGUSER: deepslate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: deepslate
      ENSURE_TEST_DB: ${TEST_STACK:-0}
    command: ["sh", "/usr/local/bin/pre-deploy.sh"]
    volumes:
      - ${DEEPSLATE_DATA}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # The database migrations of this web image, before web and api start. There is no way back from one but db-prep's
  # dump. web still applies them at its own start too, which then finds nothing to do.
  migrate:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-migrate
    restart: "no"
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 512m
    networks: [ds-internal]
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate
    command: ["pnpm", "--filter", "web", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db-prep:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # Deepslate Works 3.0: the Windows app, published by CI as a small image (.github/workflows/installer.yml); its command
  # copies the exe into dist/ci when it changed. Admin -> Build (installer) checks it and hands it out. Nothing waits
  # on it: without it the site keeps what it hands out now.
  installer:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-installer:${INSTALLER_TAG:-latest}
    pull_policy: always
    container_name: deepslate-installer
    restart: "no"
    logging: *logging
    user: "1000:1000"                   # dist/ belongs to uid 1000
    cap_drop: [ALL]
    mem_limit: 32m
    network_mode: none
    read_only: true
    environment:
      OUT: /out
    volumes:
      - ${DEEPSLATE_DATA}/dist:/out
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # Always the newest PostgreSQL: deploy/images/db is pgautoupgrade, which upgrades older data in place on start, after
  # copying it to postgres-pre-upgrade/ (the newest two copies kept). It follows `latest` only, never IMAGE_TAG: data
  # once upgraded cannot be started by an older PostgreSQL, so a rollback of web and api must not take the database
  # back. From 18 on the data is in postgres/<major>/docker; the folder is mounted one level up for that.
  postgres:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-db:latest
    pull_policy: always
    container_name: deepslate-db
    restart: unless-stopped
    logging: *logging
    # Started as the image's own postgres user (70), which owns the data folder, so the entrypoint never needs root
    # to chown or switch users and the container keeps no Linux capabilities. The data folder is 70:70, mode 700.
    user: "70:70"
    cap_drop: [ALL]
    mem_limit: 512m                     # pg_upgrade and the reindex after it run in here too
    stop_grace_period: 60s              # a clean shutdown: an upgrade will not start from a killed cluster
    command: ["postgres", "-c", "shared_buffers=128MB"]
    networks: [ds-internal]
    environment:
      POSTGRES_USER: deepslate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deepslate
    volumes:
      - ${DEEPSLATE_DATA}/postgres:/var/lib/postgresql
      - ${DEEPSLATE_DATA}/postgres-pre-upgrade:/pre-upgrade
    depends_on:
      init:
        condition: service_completed_successfully
    # the image's healthcheck: healthy once the database answers, and not while an upgrade runs

  # Pangolin's tunnel client for the site "deepslate" (planner doc 62 §2): it connects out to PANGOLIN_ENDPOINT and hands
  # the site's resources to deepslate-caddy:80. Only on ds-edge, whose firewall rules allow exactly that tunnel. No Docker
  # socket, no published ports. Its id and secret live in the stack's .env with the stack's other secrets (a new pair
  # comes from the site's page in Pangolin). Until 2026-10-23 it was a stack of its own under Dockhand.
  newt:
    image: fosrl/newt:latest
    pull_policy: always
    container_name: deepslate-newt
    restart: unless-stopped
    logging: *logging
    mem_limit: 500m                     # at 64m the kernel killed it under load (idle ~18 MiB, bursts past 64)
    cpus: "0.5"
    networks: [ds-edge]
    environment:
      NEWT_ID: ${NEWT_ID:?NEWT_ID is the Pangolin site's newt id; set it in the stack's .env}
      NEWT_SECRET: ${NEWT_SECRET:?NEWT_SECRET is the Pangolin site's newt secret; set it in the stack's .env}
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?PANGOLIN_ENDPOINT is Pangolin's https address; set it in the stack's .env}
    security_opt:
      - no-new-privileges:true

  # The stack's own reverse proxy, plain http on :80 for the newt (Pangolin's Traefik terminates TLS). It trusts only
  # ds-edge for the visitor's address and passes exactly one X-Forwarded-For on to web (deploy/home/Caddyfile).
  caddy:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-caddy:${IMAGE_TAG:-latest}   # caddy:2-alpine with deploy/home/Caddyfile inside
    pull_policy: always
    container_name: deepslate-caddy
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]         # :80 and nothing else
    mem_limit: 64m
    networks: [ds-edge, ds-web]
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST is the site's host name (deepslate.dsw.test); set it in the stack's .env}
      MAP_HOST: ${MAP_HOST:?MAP_HOST is the map's host name (map.deepslate.dsw.test); set it in the stack's .env}
      TEST_HOST: ${TEST_HOST:-test.deepslate.dsw.test}
      DS_EDGE_SUBNET: ${DS_EDGE_SUBNET:-172.27.0.0/16}
    volumes:
      - ${DEEPSLATE_DATA}/caddy/data:/data
      - ${DEEPSLATE_DATA}/caddy/config:/config
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-web
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]                     # runs as an unprivileged user and needs no Linux capabilities
    mem_limit: 768m
    networks: [ds-web, ds-internal]
    # docs/31 B-18: the internet-facing container gets the variables it reads and no others. A new variable for web
    # goes here, in apps/web/src/env.ts and in .env.example.
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate
      AUTH_SECRET: ${AUTH_SECRET}
      TOTP_SEAL_KEY: ${TOTP_SEAL_KEY:-}
      AUTH_URL: ${AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_GUILD_AUTO_JOIN: ${DISCORD_GUILD_AUTO_JOIN:-0}
      # docs/04: sign-in through Authentik (Discord or Microsoft there); unset, the site's own Discord sign-in as before
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      DISCORD_DIRECT_LOGIN: ${DISCORD_DIRECT_LOGIN:-}
      API_URL: ${API_URL:-http://deepslate-api:4000}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      MANIFEST_KEY: ${MANIFEST_KEY:-}
      MAP_URL: ${MAP_URL:-}
      SERVER_ADDRESS: ${SERVER_ADDRESS:?SERVER_ADDRESS is the address players join; set it in the stack's .env}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-deepslate-works/0.1}
      # docs/39: the build designer (the service `designer`, profile `designer`); the card says "Not set up" while
      # DESIGNER_URL is empty
      DESIGNER_URL: ${DESIGNER_URL:-}
      DESIGNER_TOKEN: ${DESIGNER_TOKEN:-}
      DESIGNER_DAILY: ${DESIGNER_DAILY:-80}
      # docs/42: the test server's card on Control Room and the Live | Test switch, for admins; nothing unless TEST_STACK=1
      TEST_STACK: ${TEST_STACK:-0}
      TEST_SITE_URL: ${TEST_AUTH_URL:-}
      TEST_API_URL: http://deepslate-api-test:4001
      TEST_SUMMARY_TOKEN: ${TEST_SUMMARY_TOKEN:-}
      TEST_APP_TOKEN: ${TEST_APP_TOKEN:-}   # docs/45: the launcher's Test section (live web and api-test only)
    volumes:
      # The manifest is edited by "apply results" and committed, so the checkout's modpack/ and .git are mounted.
      # Nothing else from the checkout (no .env, no keys) is visible to the internet-facing container.
      - ${DEEPSLATE_DIR}/modpack:/repo/modpack
      - ${DEEPSLATE_DIR}/.git:/repo/.git
      - ${DEEPSLATE_DATA}/dist:/repo/dist:ro             # built packs, served under /downloads (api builds them)
      - ${DEEPSLATE_DATA}/data:/repo/data                # uploaded pictures (Admin → Branding); not in git
      - ${DEEPSLATE_DATA}/data/private-jars:/repo/data/private-jars:ro   # docs/58: served at /downloads/mods/, never written here
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      repo-sync:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # web and its database only, never api: waiting on it made web "unhealthy" (2026-10-07)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-api
    restart: unless-stopped
    logging: *logging
    init: true                          # a small init as PID 1 reaps the ssh children node leaves behind
    cap_drop: [ALL]                     # runs as an unprivileged user and needs no Linux capabilities
    mem_limit: 512m                     # also the cap for `modpack build`, which runs as a child of api
    networks: [ds-internal, ds-amp]     # web reaches it as deepslate-api:4000 on ds-internal; the AMP host over ds-amp
    # Like web, api gets the variables it reads (apps/api/src/env.ts) and no others. Empty means unset.
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate
      PORTAL_URL: ${AUTH_URL}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      AMP_URL: ${AMP_URL:-}
      AMP_INSTANCE_ID: ${AMP_INSTANCE_ID:-}
      AMP_USERNAME: ${AMP_USERNAME:-}
      AMP_PASSWORD: ${AMP_PASSWORD:-}
      AMP_MOCK: ${AMP_MOCK:-}
      AMP_HOST: ${AMP_HOST:-}           # the AMP host on the LAN; /health's "tunnel" is a TCP check of its sshd
      ROUTER_DASH_URL: ${ROUTER_DASH_URL:-}
      # Admin → Server → Router never removes the route players join by; without it here, that guard is off
      SERVER_ADDRESS: ${SERVER_ADDRESS:-}
      RSYNC_TARGET: ${RSYNC_TARGET:-}
      DEPLOY_KEY_PATH: ${DEPLOY_KEY_PATH:-}
      LIMBO_POS: ${LIMBO_POS:-}
      SPAWN_POS: ${SPAWN_POS:-}
      # docs/42a: this api is the one instance that talks to the players' Discord (the bot and the webhooks below).
      # Exactly one live api may run (doc 62 §3.4): the cutover stops the VPS's before this one starts. Unset or 1 =
      # it talks. 0 = the dry run of doc 62 §5.4, while the VPS's api is still the one that talks: the bot token is
      # then used only to answer the sign-in's "is this account in the Discord server?" (discord/member.ts); no bot
      # comes online and the webhooks below are not used.
      DISCORD_TALKS: ${DISCORD_TALKS:-1}
      DISCORD_PLAYER_ROLE_ID: ${DISCORD_PLAYER_ROLE_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_WEBHOOK_FEED: ${DISCORD_WEBHOOK_FEED:-}
      DISCORD_WEBHOOK_ADMIN: ${DISCORD_WEBHOOK_ADMIN:-}
      DISCORD_WEBHOOK_UPDATES: ${DISCORD_WEBHOOK_UPDATES:-}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-}
      GEOIP_DB: ${GEOIP_DB:-}
      BACKUP_PUBLIC_KEY: ${BACKUP_PUBLIC_KEY:-}
    volumes:
      # the deploy key, and known_hosts beside it once it has been made (B-23: the AMP host's key is then pinned)
      - ${DEEPSLATE_DIR}/deploy/keys:/run/keys:ro
      # the nightly database dumps; api copies the newest to the AMP host (docs/28 §4.7)
      - ${DEEPSLATE_DATA}/backups:/dbdumps:ro
      - ${DEEPSLATE_DATA}/dist:/repo/dist                # `modpack build` writes it (owner uid 1000); the sync rsyncs dist/server/ to the AMP host
      - ${DEEPSLATE_DIR}/modpack:/repo/modpack:ro       # installer/ is in the image
      - ${DEEPSLATE_DATA}/data/news:/repo/data/news:ro   # docs/21: news pictures go to Discord as attachments
      - ${DEEPSLATE_DATA}/data/builds:/repo/data/builds:ro # docs/34 §10: builds an admin uploaded
      - ${DEEPSLATE_DATA}/data/private-jars:/repo/data/private-jars:ro # docs/58: private jars
      # country lookup for the analytics page: MaxMind's GeoLite2-Country, kept current by the geoipupdate service below
      - ${DEEPSLATE_DATA}/geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      repo-sync:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    # docs/31 B-09: api answers. Whether it reaches the AMP host is in the answer (web's /api/health).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --header=\"Authorization: Bearer $$API_SERVICE_TOKEN\" http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  # The map: one relay from ds-web to BlueMap on the AMP host (the VPS needed two, one each side of the tunnel).
  map-relay:
    image: alpine/socat:latest
    pull_policy: always
    container_name: deepslate-map-relay
    restart: unless-stopped
    logging: *logging
    user: "65534:65534"                # nobody: port 8100 needs no root
    cap_drop: [ALL]
    mem_limit: 32m
    networks: [ds-web, ds-amp]
    command: TCP-LISTEN:8100,fork,reuseaddr TCP:${AMP_HOST:?AMP_HOST is the AMP host's LAN address; set it in the stack's .env}:8100

  # MaxMind's GeoLite2-Country for the analytics page, refreshed every 72 h. Profile `geoip`: on while COMPOSE_PROFILES
  # names it (with GEOIPUPDATE_ACCOUNT_ID set in the .env); without it api runs with no countries.
  geoipupdate:
    profiles: [geoip]
    image: ghcr.io/maxmind/geoipupdate:latest
    pull_policy: always
    container_name: deepslate-geoipupdate
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    networks: [ds-amp]                  # the internet, nothing on the LAN
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      - ${DEEPSLATE_DATA}/geoip:/usr/share/GeoIP
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # docs/42: the test server's own copy of the site, hidden from players. Profile `test`: on while COMPOSE_PROFILES names
  # it, with TEST_STACK=1, which also tells db-prep to make the
  # test database. Their images are tag TEST_IMAGE_TAG (dev: CI builds it on each push to dev that changes an image),
  # pulled on a redeploy. Every host path is the test checkout's (TEST_DIR, on dev), so nothing the test site builds
  # lands in the live dist/. The defaults only keep `docker compose config` working while the TEST_ variables are unset.
  init-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-ops:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-init-test
    restart: "no"
    logging: *logging
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 32m
    network_mode: none
    command: ["sh", "/usr/local/lib/deepslate/init.sh"]
    volumes:
      - ${TEST_DIR:-/nonexistent}:/test
      - ${DEEPSLATE_DIR}/deploy/keys-test:/keys-test
    security_opt:
      - no-new-privileges:true

  # The test checkout to origin/dev (not while it is held). Its .git is mounted into no
  # container read-write, so it has no guard copies.
  repo-sync-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-ops:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-repo-sync-test
    restart: "no"
    logging: *logging
    user: "${DEEPSLATE_UID:-1000}:${DEEPSLATE_GID:-1000}"
    cap_drop: [ALL]
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    networks: [ds-web]
    environment:
      HOME: /tmp
      SYNC_BRANCHES: dev
    command: ["sh", "/usr/local/lib/deepslate/repo-sync.sh"]
    volumes:
      - ${TEST_DIR:-/nonexistent}:/repo
    depends_on:
      init-test:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  web-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-web:${TEST_IMAGE_TAG:-dev}
    pull_policy: always
    container_name: deepslate-web-test
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 512m
    networks: [ds-web, ds-internal]
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate_test
      AUTH_SECRET: ${TEST_AUTH_SECRET:-}
      AUTH_URL: ${TEST_AUTH_URL:-https://test.deepslate.dsw.test}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID:-}
      DISCORD_GUILD_AUTO_JOIN: "0"
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      DISCORD_DIRECT_LOGIN: ${TEST_DISCORD_DIRECT_LOGIN:-}
      API_URL: http://deepslate-api-test:4001
      API_SERVICE_TOKEN: ${TEST_API_SERVICE_TOKEN:-}
      SERVER_ADDRESS: ${TEST_SERVER_ADDRESS:-lab.dsw.test}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-deepslate-works/0.1}
      TEST_MODE: "1"
      SEASONS_SHIP: ${TEST_SEASONS_SHIP:-}
      LIVE_SITE_URL: ${AUTH_URL}
      LIVE_MODPACK_DIR: /live-modpack
    volumes:
      - ${TEST_DIR:-/nonexistent}/modpack:/repo/modpack:ro
      - ${TEST_DIR:-/nonexistent}/dist:/repo/dist:ro
      - ${TEST_DIR:-/nonexistent}/data:/repo/data
      - ${TEST_DIR:-/nonexistent}/data/private-jars:/repo/data/private-jars:ro
      - ${DEEPSLATE_DIR}/modpack:/live-modpack:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-prep:
        condition: service_completed_successfully   # the test database exists
      repo-sync-test:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api-test:
    profiles: [test]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-api:${TEST_IMAGE_TAG:-dev}
    pull_policy: always
    container_name: deepslate-api-test
    restart: unless-stopped
    logging: *logging
    init: true
    cap_drop: [ALL]
    mem_limit: 384m
    networks: [ds-internal, ds-amp]
    environment:
      DATABASE_URL: postgresql://deepslate:${POSTGRES_PASSWORD}@postgres:5432/deepslate_test
      PORT: "4001"
      PORTAL_URL: ${TEST_AUTH_URL:-https://test.deepslate.dsw.test}
      API_SERVICE_TOKEN: ${TEST_API_SERVICE_TOKEN:-}
      AMP_URL: ${AMP_URL:-}
      AMP_INSTANCE_ID: ${TEST_AMP_INSTANCE_ID:-}
      AMP_USERNAME: ${TEST_AMP_USERNAME:-}
      AMP_PASSWORD: ${TEST_AMP_PASSWORD:-}
      AMP_MOCK: ${TEST_AMP_MOCK:-}
      AMP_HOST: ${AMP_HOST:-}
      ROUTER_DASH_URL: ${ROUTER_DASH_URL:-}
      SERVER_ADDRESS: ${TEST_SERVER_ADDRESS:-}
      RSYNC_TARGET: ${TEST_RSYNC_TARGET:-}
      DEPLOY_KEY_PATH: /run/keys/deploy.key
      LIMBO_POS: ${LIMBO_POS:-}
      SPAWN_POS: ${SPAWN_POS:-}
      # docs/42a: silent on Discord (no DISCORD_TALKS); only a private channel's webhooks, when set
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_PRIVATE_WEBHOOK_FEED: ${TEST_DISCORD_WEBHOOK_FEED:-}
      DISCORD_PRIVATE_WEBHOOK_ADMIN: ${TEST_DISCORD_WEBHOOK_ADMIN:-}
      DISCORD_PRIVATE_WEBHOOK_UPDATES: ${TEST_DISCORD_WEBHOOK_UPDATES:-}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-}
      GEOIP_DB: ${GEOIP_DB:-}
      TEST_MODE: "1"
      TEST_SUMMARY_TOKEN: ${TEST_SUMMARY_TOKEN:-}
      TEST_APP_TOKEN: ${TEST_APP_TOKEN:-}
      SEASONS_SHIP: ${TEST_SEASONS_SHIP:-}
    volumes:
      - ${DEEPSLATE_DIR}/deploy/keys-test:/run/keys:ro
      - ${TEST_DIR:-/nonexistent}/dist:/repo/dist
      - ${TEST_DIR:-/nonexistent}/modpack:/repo/modpack:ro
      - ${TEST_DIR:-/nonexistent}/data/news:/repo/data/news:ro
      - ${TEST_DIR:-/nonexistent}/data/builds:/repo/data/builds:ro
      - ${TEST_DIR:-/nonexistent}/data/private-jars:/repo/data/private-jars:ro
      - ${TEST_DIR:-/nonexistent}/.git:/repo/.git:ro
      - ${DEEPSLATE_DATA}/geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      web-test:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --header=\"Authorization: Bearer $$API_SERVICE_TOKEN\" http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  # docs/39: the build designer, a CLI run for admins by tools/designer/server.mjs, as the designer's own host user,
  # signed in on Alex's plan. Profile `designer`: on while COMPOSE_PROFILES names it (with DESIGNER_CMD
  # set in the .env). server.mjs and the instructions are in the image (deploy/images/designer).
  # web reaches it at deepslate-designer:4100 with DESIGNER_TOKEN. The CLI gets no tools and only HOME and PATH of the
  # environment. On ds-web, where the host's firewall allows public https and nothing private: the model's API, and
  # web, which is on ds-web too. Moved from the VPS on 2026-10-23.
  designer:
    profiles: [designer]
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-designer:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: deepslate-designer
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    mem_limit: 768m                     # the CLI used under 300 MB in each call of docs/39 Step 0.4
    user: "${DESIGNER_UID:-65534}:${DESIGNER_GID:-65534}"
    read_only: true
    tmpfs: [/tmp]
    networks: [ds-web]
    working_dir: /tmp
    command: ["node", "/designer/server.mjs"]
    environment:
      HOME: ${DESIGNER_HOME:-/nonexistent}
      PATH: ${DESIGNER_BIN_DIR:-/nonexistent}:/usr/local/bin:/usr/bin:/bin
      DISABLE_AUTOUPDATER: "1"
      DESIGNER_CMD: ${DESIGNER_CMD:-}
      DESIGNER_MODEL: ${DESIGNER_MODEL:-}
      DESIGNER_TOKEN: ${DESIGNER_TOKEN:-}
      DESIGNER_CREDENTIALS: ${DESIGNER_CREDENTIALS:-}
      DESIGNER_DAILY: ${DESIGNER_DAILY:-80}   # the designer keeps its own count too (tools/designer/server.mjs)
      DESIGNER_DATA: /designer-data
    volumes:
      # blocks.json. web CAN write this: it mounts modpack/ read-write. server.mjs takes only plain ids, known kinds and
      # plain property values from it, and drops anything else (blockListText).
      - ${DEEPSLATE_DIR}/modpack/designer:/designer-data:ro
      - ${DESIGNER_HOME:-/nonexistent}:${DESIGNER_HOME:-/nonexistent}
      - ${DESIGNER_BIN_DIR:-/nonexistent/bin}:${DESIGNER_BIN_DIR:-/nonexistent/bin}:ro
      - ${DESIGNER_VERSIONS_DIR:-/nonexistent/versions}:${DESIGNER_VERSIONS_DIR:-/nonexistent/versions}:ro
    depends_on:
      repo-sync:
        condition: service_completed_successfully   # modpack/designer
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4100, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  backups:
    image: ghcr.io/${GHCR_OWNER:-unset}/deepslate-backups:latest   # postgres:alpine with backup-loop.sh; never older than the database
    pull_policy: always
    container_name: deepslate-backups
    restart: unless-stopped
    logging: *logging
    # the image's postgres user, not root: init gives the dumps' folder to 70:70 (api reads the dumps as uid 1000)
    user: "70:70"
    cap_drop: [ALL]
    mem_limit: 64m
    networks: [ds-internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DEEPSLATE_DATA}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Nightly pg_dump at 00:00 UTC to deepslate-YYYY-MM-DD.sql.gz, the newest 14 kept (deploy/backup-loop.sh, in the
    # image since it has to change with it: a new script arrives with the image, and the container with it)
    command: ["sh", "/backup-loop.sh"]
