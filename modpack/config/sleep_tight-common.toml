# Sleep Tight with its hammocks and night bags only (Alex, 2026-10-20): every change it makes to sleeping is off, so
# beds work as in vanilla. Keys and ranges are the mod's own (1.21-1.6.3, CommonConfigs); each key is present so the
# game has nothing to correct. A synced config: the server's copy is the one that counts, and PCs are sent it.

[misc]
	#Makes players respawn by laying on their bed
	respawn_laying = false
	#Fixes multiplayer players being positioned 2 pixels above a bed
	fix_bed_position = true
	#Allows laying on a bed when you are on sleeping cooldown
	lay_when_on_cooldown = true
	#Allows player to sleep in the middle of two beds
	queen_size_bed = true
	#Disables damage from bed explosion when used in another dimension. Can also be used to disable explosion entirely allowing one to sleep in those dimensions
	#Allowed Values: DEFAULT, TINY_EXPLOSION, ALLOWS_SLEEPING, ALLOWS_SLEEPING_NO_RESPAWN
	behavior_in_dimension = "DEFAULT"
	#Interval between two consecutive sleep times for them to not be considered consecutive
	# Default: 24000
	# Range: 0 ~ 1000000
	sleep_interval = 24000
	#Makes night bag less unique by allowing you to place them normally on the ground
	boring_night_bags = false
	#Immediately attempt sleeping after laying down on a bed (Deepslate Works: true, as in vanilla)
	sleep_immediately = true

	[misc.heartstone_mod_integration]
		#Gives some benefit when sleeping next to somebody else. By default only works in conjunction with heartstone mod (Deepslate Works: OFF)
		#Allowed Values: HEARTSTONE_PLAYER_OR_VILLAGER, HEARTSTONE_PLAYER, ANY_PLAYER_OR_VILLAGER, ANY_PLAYER, OFF
		enabled = "OFF"
		#Effect to give to players when they wake up
		effects = []

[bedbugs]
	#Turns off bedbug spawning entirely. Bedbugs will still exist as a mob and can be spawned with eggs (Deepslate Works: false)
	enabled = false
	#Base spawn chance every time you wake up, increases with difficulty
	# Default: 0.11
	# Range: 0.0 ~ 1.0
	spawn_chance = 0.11
	#max radius at which they can spawn
	# Default: 24
	# Range: 1 ~ 64
	max_spawn_radius = 24
	#min radius from which they can spawn
	# Default: 12
	# Range: 1 ~ 64
	min_spawn_radius = 12
	#Max light level that a bedbug can spawn at
	# Default: 15
	# Range: 0 ~ 15
	max_allowed_light_level = 15
	#The game will perform x attempts to spawn a bedbug around each player when they wake up. This already takes into account the chance config.High values will decrease failed attempts
	# Default: 20
	# Range: 0 ~ 1000
	tries = 20
	#Prevents bedbugs when using dream essence
	prevented_by_dream_essence = false
	#Only spawns bedbugs when sleeping in your home bed
	only_when_in_home_bed = false
	#Chance for each bed generated in a woodland mansion to start out infested with a bedbug. Set to 0 to disable (Deepslate Works: 0)
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	mansion_infestation_chance = 0.0
	#Enables phantom-style ambient bedbug spawning while awake (requires consistent recent sleep, opposite of phantoms) (Deepslate Works: false)
	ambient_spawner = false
	#Consecutive nights slept before ambient bedbugs can appear (phantoms use ~3 nights without sleep)
	# Default: 3
	# Range: 1 ~ 50
	ambient_min_consecutive_nights = 3
	#Min spawn distance from the player for ambient bedbugs. Note that natural spawn rules still forbid spawning within 24 blocks of any player, so values below that have no effect
	# Default: 24
	# Range: 1 ~ 64
	ambient_min_spawn_radius = 24
	#Max spawn distance from the player for ambient bedbugs
	# Default: 48
	# Range: 1 ~ 64
	ambient_max_spawn_radius = 48

[sleep_cooldown]
	#Time before you can sleep/rest again after you've slept in a hammock (Deepslate Works: 0, no cooldown)
	# Default: 6000
	# Range: 0 ~ 1000000
	hammock = 0
	#Time before you can sleep/rest again after you've successfully slept in a night bag (Deepslate Works: 0)
	# Default: 6000
	# Range: 0 ~ 1000000
	night_bag = 0
	#Time before you can sleep/rest again after you've successfully slept in a bed (Deepslate Works: 0)
	# Default: 6000
	# Range: 0 ~ 1000000
	bed = 0

[sleep_benefits]
	#Which type of beds will apply benefits on wake up (Deepslate Works: NONE, no healing, no effects cleared or given, as in vanilla)
	#Allowed Values: NONE, ALWAYS, HOME_BED
	active_for = "NONE"
	#Healing applied on wake up
	#Allowed Values: NONE, TIME_BASED, MAX
	healing = "MAX"
	#Allowed Values: NONE, TIME_BASED, MAX
	effect_clearing = "MAX"
	#Allowed Values: ALL, BENEFICIAL, HARMFUL, NEUTRAL
	effect_clearing_types = "ALL"
	#Effects to apply when player wakes up. You can add more entries, this is a list (Deepslate Works: none)
	effects_on_wake_up = []

[sleep_penalties]
	#Applies a cost, like hunger loss, every time you sleep (Deepslate Works: false)
	enabled = false
	apply_to_beds = true
	apply_to_hammock = true
	apply_to_night_bags = true
	#Method to calculate hunger loss. Can be based off time slept, difficulty or constant
	#Allowed Values: CONSTANT, TIME_BASED, DIFFICULTY_BASED, TIME_DIFFICULTY_BASED
	consumed_hunger_mode = "TIME_DIFFICULTY_BASED"
	#Base hunger decrement value. Depends on other config. Set to 0 to disable
	# Default: 5.0
	# Range: 0.0 ~ 20.0
	base_value = 5.0

[sleep_requirements]
	#Conditions that must be met before you are allowed to sleep (Deepslate Works: false)
	enabled = false
	apply_to_beds = true
	apply_to_hammock = true
	apply_to_night_bags = true
	#Requires player to have full hunger bar before being able to sleep
	require_full_hunger = false
	#Xp cost for sleeping. Does not affect peaceful
	# Default: 0
	# Range: 0 ~ 200
	xp_cost = 0

[home_bed]
	#Amount of nights needed to make a home bed start increasing levels. Set to -1 to effectively disable home bed leveling (Deepslate Works: -1)
	# Default: 6
	# Range: -1 ~ 50
	home_bed_benefit_required_nights = -1
	#Percentage of xp added per tier of the effect. Setting to 1 doubles the effect
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	invigorated_effect_xp = 0.1
	#Home bed level cap. Each night slept increases this number
	# Default: 100
	# Range: 0 ~ 1000
	max_level_cap = 100
	#Makes respawning only possible when using your own Home Bed. Fight back the night!
	only_respawn_in_home_bed = false

[nightmares]
	#Sleeping too many nights in a row can end in a nightmare, waking you up early (Deepslate Works: false)
	enabled = false
	apply_to_beds = true
	apply_to_hammock = false
	apply_to_night_bags = false
	#Amount of consecutive nights slept after which nightmares could start to happen
	# Default: 3
	# Range: 0 ~ 100
	appear_after_consecutive_nights = 3
	# Default: 0.16
	# Range: 0.0 ~ 1.0
	nightmare_increment_per_night = 0.16
	#Multiplier applied to time slept after a nightmare
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	sleep_time_multiplier = 0.5
	#Refractory period after a nightmare in which you won't be able to sleep
	# Default: 36000
	# Range: 0 ~ 1000000
	insomnia_duration = 36000
	#Chance multiplier to have a nightmare when sleeping in a special bed. A 'special bed' is simply any (likely modded) bed that cant be targeted by a villager and or bedbug. Increased chance since you would be skipping bedbugs encounter otherwise
	# Default: 1.2
	# Range: 1.0 ~ 5.0
	special_bed_nightmare_chance_mult = 1.2

[wake_up_encounters]
	#Sleeping in an exposed spot can wake you up to a mob that spawned next to you (Deepslate Works: false)
	enabled = false
	#The game will perform x attempts to spawn a mod around each player every time they sleep.Increases likelihood of finding one. Note that actual value will also depend on local difficulty
	# Default: 25
	# Range: 0 ~ 1000
	tries = 25
	#Max amount of mobs per encounter
	# Default: 1
	# Range: 0 ~ 20
	max_count = 1
	# Default: 10
	# Range: 1 ~ 32
	spawn_radius = 10
	# Default: 2
	# Range: 0 ~ 32
	min_radius = 2
	# Default: 3
	# Range: 1 ~ 10
	height = 3
	#Mobs that can randomly wake up the player if sleeping in a dark place. Leave empty to use default spawning behavior
	alternative_whitelist = []
	#Multiplier applied to time slept after an encounter
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	sleep_time_multiplier = 0.5
	#Refractory period after an encounter in which you won't be able to sleep
	# Default: 12000
	# Range: 0 ~ 1000000
	insomnia_duration = 12000
