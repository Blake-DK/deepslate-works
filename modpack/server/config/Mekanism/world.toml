# Mekanism 10.7.19, settings shipped with the pack (docs/53 Part B). Sync puts this file into the server's
# config/Mekanism/ folder (a SERVER config: NeoForge 21.1 keeps those in config/); Mekanism reads it at start and adds
# every key not written here with its default.
#
# The main world was generated without Mekanism, so it has none of Mekanism's ores or salt. With regeneration on and
# the world version at 1, Mekanism adds them to every chunk saved below version 1 the first time that chunk is loaded,
# and saves the chunk at version 1, so each chunk is touched once. Leave both as they are: userWorldGenVersion must stay
# at 1 and must never be raised again without a plan (it would add the ores a second time to every chunk).

enableRegeneration = true
userWorldGenVersion = 1
