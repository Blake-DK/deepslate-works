##                          ##
##         BlueMap          ##
##      Core-Config         ##
##                          ##
# Deepslate Works server override (docs/02 "BlueMap behind login"). Missing keys use BlueMap's defaults.

# Mojang's textures/models are needed for rendering; we accept the download (docs/13: server-side only).
accept-download: true

# Where BlueMap keeps its rendered maps and data, relative to the server folder.
data: "bluemap"

# Three render threads (2026-09-30, planner): the VM has 15 GB and the server 10 GB. The portal still stops
# BlueMap's threads while somebody is on (the pre-generation's "when nobody's online"), so players never share
# the CPU with a render. Applied without a restart by Admin → Server → Pre-generation → "Reload BlueMap's settings".
render-thread-count: 3

metrics: false
