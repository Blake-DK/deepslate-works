##                          ##
##         BlueMap          ##
##      Core-Config         ##
##                          ##
# Deepslate Works server override (docs/02 "BlueMap behind login"). Missing keys use BlueMap's defaults.

# Mojang's textures/models are needed for rendering; we accept the download (docs/13: server-side only).
accept-download: true

# Where BlueMap keeps its rendered maps and data, relative to the server folder.
data: "bluemap"

# One render thread: this instance shares the box with the game and has 6 GB.
render-thread-count: 1

metrics: false
