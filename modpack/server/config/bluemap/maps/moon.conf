# Deepslate Works: the Moon (docs/55 M5). BlueMap writes map configs only for the worlds it finds at its first start,
# so a dimension added later gets none; this one is shipped. The map's id is the file's name ("moon"), the one the
# portal's Pre-generation renders for deepslate:moon. Keys as in BlueMap 5.7's own template (maps/map.conf in its jar).
world: "world"
dimension: "deepslate:moon"
name: "Ashmoon"
sorting: 5
sky-color: "#1b1d26"
void-color: "#000000"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: 40
cave-detection-ocean-floor: -5
storage: "file"
