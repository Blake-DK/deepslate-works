# Lithium on the server only (players keep every Lithium optimisation).
#
# TACZ Turrets 4.2.0's turret entity names a class that exists only on players' PCs. Lithium's entity collision
# and grouping code reads each moving entity's methods by reflection, which makes the dedicated server load that
# class and crash ("Lithium Class Analysis") as soon as a placed turret moves. Players then see "internal server
# error". These options keep Lithium away from that reflection; the server uses vanilla code for these parts.
mixin.entity.collisions=false
mixin.chunk.entity_class_groups=false
