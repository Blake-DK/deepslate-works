MISSILE_SILO_HEIGHT=3 #How many casing blocks tall the gantry corner pillars must be built | default: 3
MISSILE_CRUISE_ALTITUDE=45 #How high above the launch point the missile climbs before cruising to target | default: 45
MISSILE_SPEED_MULTIPLIER=1.0 #Global multiplier on every missile's own climb and cruise speed; 1.0 leaves the physics untouched | default: 1.0
MISSILE_AIRBURST_DEFAULT=0 #Default detonation height above the target surface, in blocks | default: 0
MISSILE_MAX_RANGE=500 #Maximum horizontal distance in blocks a missile may be fired | default: 100000
MISSILE_LAUNCH_BOOST=12 #Standard number of blocks the missile rises straight up before arcing; each launch controller can change it | default: 12
MISSILE_MAX_LAUNCH_BOOST=200 #Highest boost a launch controller may be set to, in blocks | default: 200
MISSILE_BOOST_RANGE_COST=0.5 #Percent of a missile's range lost for each block of boost above the standard boost | default: 0.5
MISSILE_AUTO_CLIMB_LIMIT=64 #Most blocks a missile climbs on its own above its boost when hills or trees block the start of its arc; 0 turns this off | default: 64
MISSILE_MAX_FORCED_CHUNKS=512 #How many chunks all in-flight missiles in one dimension may force-load at once | default: 512
MISSILE_RANGE_PER_DELTA_V=20000.0 #How many blocks of range one point of delta-v buys | default: 20000.0
MISSILE_FUEL_TANK_CAPACITY=16000 #Capacity in mB of the silo's liquid propellant tank | default: 16000
MISSILE_ENERGY_CAPACITY=200000 #Energy buffer of the launch controller in FE | default: 200000
MISSILE_ENERGY_TRANSFER_RATE=2000 #Maximum FE per tick the launch controller accepts | default: 2000
MISSILE_FUELING_RATE_PER_SECOND=2.0 #Fuel mass loaded into the missile per second before fuel-specific multipliers | default: 2.0
MISSILE_FUELING_ENERGY_PER_TICK=20 #FE consumed per tick while fueling a missile | default: 20
MISSILE_LAUNCH_ENERGY=50000 #FE consumed by a single launch | default: 50000
MISSILE_BOILOFF_PER_SECOND=0.05 #Fuel mass a cryogenic-fuelled missile loses per second while it waits on the pad | default: 0.05
MISSILE_FUEL_BLAST_PER_MASS=0.15 #Explosion power per unit of loaded fuel mass when a fuelled silo is destroyed | default: 0.15
MISSILE_FUEL_BLAST_MAX_POWER=8.0 #Upper limit on the explosion power of a fuelled silo cooking off | default: 8.0
MISSILE_ARC_TERRAIN_CLEARANCE=10 #How many blocks of headroom a ballistic missile keeps above terrain it flies over | default: 10
MISSILE_CRUISE_CLIMB_RATE=1.6 #Fastest a cruise missile climbs in blocks per tick when terrain rises ahead of it | default: 1.6
MISSILE_CRUISE_DESCEND_RATE=0.35 #Fastest a cruise missile sinks in blocks per tick once terrain drops away below it | default: 0.35
MISSILE_CRUISE_LOOKAHEAD=32 #How far ahead in blocks a cruise missile reads terrain to plan its climb | default: 32
MISSILE_CRUISE_FOLLOW_ALTITUDE=12 #How many blocks above the ground a terrain-following cruise missile flies | default: 12
MISSILE_RADAR_RANGE_PER_TIER=400 #Base detection radius in blocks granted by each radar tier before signature and altitude gains | default: 400
MISSILE_RADAR_SCAN_INTERVAL=20 #Ticks between radar sweeps; each sweep costs one charge of scan energy | default: 20
MISSILE_RADAR_ENERGY_CAPACITY=100000 #Energy buffer of the early warning radar in FE | default: 100000
MISSILE_RADAR_ENERGY_PER_SCAN=200 #FE consumed by one radar sweep; a radar that cannot pay goes blind | default: 200
MISSILE_RADAR_BASE_SIGNATURE=4 #Radar signature that counts as normal; a missile above this is seen further away and below it closer | default: 4
MISSILE_RADAR_HORIZON=40 #How far above the radar a missile must fly to be seen over the horizon; below this it needs line of sight | default: 40
MISSILE_RADAR_COMPARATOR_WINDOW=600 #Time to impact in ticks at which a radar's comparator output starts rising from 1 toward 15 | default: 600
MISSILE_RADAR_MAX_TRACKS=8 #How many simultaneous tracks one radar reports | default: 8
MISSILE_SIREN_LINK_RANGE=64 #How far a warning siren looks for a radar to take its tracks from | default: 64
MISSILE_SIREN_ALERT_RADIUS=256 #How close a projected impact must be for the siren to sound and warn players | default: 256

