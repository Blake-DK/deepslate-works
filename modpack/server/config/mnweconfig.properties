BLAST_BLOCK_BUDGET_PER_TICK=2000000 #Safety cap on block positions a staged blast may process per tick, 0 disables it. Stock radii stay under this; raising a bomb radius a long way past its default is what makes it engage | default: 2000000
BLAST_FORCE_LOAD_CHUNKS=true #Whether a staged blast force-loads the chunks it will carve, so it works across unloaded chunk borders | default: true
BLAST_MAX_FORCED_CHUNK_RADIUS=10 #Hard cap on how many chunks out from the blast centre may be force-loaded | default: 10
BLAST_CHUNK_WARMUP_MAX_TICKS=200 #How long a staged blast waits for its force-loaded chunks to finish loading before carving anyway. Too low and a blast into unexplored terrain leaves gaps | default: 200
INDUSTRIAL_BOMB_POWER=8.0 #Explosion power of the Industrial Bomb, vanilla TNT is 4.0 | default: 8.0
INDUSTRIAL_BOMB_FUSE=60 #Fuse time of the Industrial Bomb in ticks | default: 60
INDUSTRIAL_BOMB_CAUSES_FIRE=false #Whether the Industrial Bomb sets the blast area on fire | default: false
NUCLEAR_BOMB_MAX_RADIUS=32 #Maximum explosion radius of the Nuclear Bomb | default: 32
NUCLEAR_BOMB_RADIUS_STEP_PER_TICK=5.0 #How many blocks the Nuclear Bomb explosion expands per tick | default: 5.0
NUCLEAR_BOMB_RADIATION=32000.0 #Mekanism Radiation magnitude for the Nuclear Bomb | default: 32000.0
HYDROGEN_BOMB_MAX_RADIUS=64 #Maximum explosion radius of the Hydrogen Bomb | default: 64
HYDROGEN_BOMB_RADIUS_STEP_PER_TICK=8.0 #How many blocks the Hydrogen Bomb explosion expands per tick | default: 8.0
HYDROGEN_BOMB_RADIATION=100000.0 #Mekanism Radiation magnitude for the Hydrogen Bomb | default: 100000.0
ANTIMATTER_BOMB_MAX_RADIUS=124 #Maximum explosion radius of the Antimatter Bomb | default: 124
ANTIMATTER_BOMB_RADIUS_STEP_PER_TICK=10.0 #How many blocks the Antimatter Bomb explosion expands per tick | default: 10.0
ANTIMATTER_BOMB_RADIATION=500000.0 #Mekanism Radiation magnitude for the Antimatter Bomb | default: 500000.0
SHAPED_CHARGE_RANGE=24 #How far the Shaped Charge cone reaches along the block's facing | default: 24
SHAPED_CHARGE_CONE_ANGLE=18.0 #Half-angle of the Shaped Charge cone in degrees. Smaller is a narrower, more surgical cut | default: 18.0
SHAPED_CHARGE_DAMAGE=30.0 #Damage the Shaped Charge deals to entities caught in the jet, before distance falloff | default: 30.0
INCENDIARY_BOMB_RADIUS=6 #Blast radius of the Incendiary Bomb. Deliberately small, the fire is the weapon | default: 6
INCENDIARY_BOMB_NAPALM_RADIUS=10 #Radius of the napalm fire field the Incendiary Bomb leaves behind | default: 10
INCENDIARY_BOMB_DAMAGE=8.0 #Direct blast damage of the Incendiary Bomb, before distance falloff | default: 8.0
NAPALM_IGNITES_BLOCKS=false #Whether napalm sets flammable blocks alight with ordinary fire, so the fire actually burns terrain down instead of only hurting entities standing in it. Turn off on servers where you want the fire to be non-destructive | default: true
FRAGMENTATION_BOMB_RADIUS=20 #How far Fragmentation Bomb shrapnel reaches. It destroys no blocks | default: 20
FRAGMENTATION_BOMB_DAMAGE=40.0 #Shrapnel damage at the centre, falling off with distance and blocked by cover | default: 40.0
FRAGMENTATION_BOMB_PARTICLES=160 #How many visible shrapnel streaks the Fragmentation Bomb throws. 0 turns them off | default: 160
SEISMIC_CHARGE_RADIUS=28 #Radius of the Seismic Charge shockwave | default: 28
SEISMIC_CHARGE_MAX_BLOCK_RESISTANCE=4.0 #The Seismic Charge only destroys blocks with an explosion resistance at or below this. Stone is 6.0, dirt 0.5, wood 3.0 | default: 4.0
SEISMIC_CHARGE_DAMAGE=35.0 #Shockwave damage at the centre. Ignores cover, falls off with distance | default: 35.0
SEISMIC_CHARGE_MAX_LAUNCHED_BLOCKS=600 #How many blocks a single Seismic Charge may throw outwards as flying falling-blocks. Past this cap the rest are simply removed, which keeps a big charge from spawning thousands of entities | default: 600
GAS_CLOUD_RADIUS=18 #Radius of the cloud a gas warhead leaves behind | default: 18
GAS_CLOUD_DURATION=3600 #How long a gas cloud lasts, in ticks. 3600 is three minutes | default: 3600
GAS_CLOUD_MAX_VOLUME=5000 #Hard cap on how many blocks one gas cloud may occupy. This is the main performance dial for gas warheads | default: 5000
GAS_CLOUD_RISE=4 #How far a gas cloud may climb above where it was released. Low values make it pool in hollows and cellars | default: 4
GAS_CLOUD_REFLOW_INTERVAL=40 #How often a gas cloud recomputes the volume it fills, in ticks. Lower is more responsive to doors opening, and more expensive | default: 40
GAS_CLOUD_EFFECT_INTERVAL=20 #How often a gas cloud damages and poisons what is standing in it, in ticks | default: 20
GAS_CLOUD_GROWTH_FRACTION=0.06 #Fraction of its life a gas cloud spends expanding to full size | default: 0.06
GAS_CLOUD_FADE_FRACTION=0.3 #Fraction of its life a gas cloud spends thinning back out | default: 0.3
GAS_CLOUD_PARTICLE_SITES=34 #How many points of a gas cloud emit particles each burst. The cloud is drawn by sweeping through its whole volume, so this is visual density, not size. Lower it if gas clouds cost you frames or bandwidth | default: 34
GAS_CLOUD_KILLS_CROPS=false #Whether gas clouds destroy crops and other plants they drift over | default: true
CRYO_CHARGE_RADIUS=14 #Radius of the Cryo Charge. It freezes water, solidifies lava and puts out fire, including napalm | default: 14
CRYO_CHARGE_DAMAGE=6.0 #Cold damage the Cryo Charge deals at the centre, before distance falloff | default: 6.0
CRYO_CHARGE_CHILL_TICKS=1200 #How long the Cryo Charge's Slowness and Mining Fatigue last at the centre, in ticks. 1200 is a minute | default: 1200
CRYO_CHARGE_MIN_CHILL_TICKS=300 #Floor on the Cryo Charge's Slowness and Mining Fatigue, so being caught at the very edge of the blast still means something | default: 300
CRYO_ICE_THAW_TICKS=300 #How long a cryo charge's ice lasts before it starts thawing back into water, in ticks. The ice melts in stages from the edges inwards, so a big frozen lake outlives this by a good margin | default: 300
DIRTY_BOMB_RADIUS=6 #Blast radius of the Dirty Bomb. Deliberately tiny - the radiation is the weapon | default: 6
DIRTY_BOMB_RADIATION=60000.0 #Mekanism Radiation magnitude for the Dirty Bomb. Large for how cheap it is | default: 60000.0
DIRTY_BOMB_FALLOUT_RADIUS=28 #How far the Dirty Bomb spreads irradiated soil | default: 28
FALLOUT_RADIUS_FRACTION=0.0 #Width of the irradiated soil band a nuclear warhead lays past its crater rim, as a fraction of its blast radius. The crater floor is always covered. 0 disables fallout for the nuclear line | default: 0.6
FALLOUT_RADIATION=0.0 #Radiation each irradiated soil block leaks per random tick. 0 makes fallout inert but still barren | default: 40.0
FALLOUT_DECAYS=true #Whether irradiated soil slowly weathers back into dirt. Turn off to make fallout permanent | default: true
FALLOUT_DECAY_CHANCE=0.05 #Chance per random tick that irradiated soil ages one step towards clean dirt. Lower means fallout lingers for longer | default: 0.05
BUNKER_BUSTER_BURROW_DISTANCE=24 #How many blocks the Bunker Buster tunnels along its heading before detonating | default: 24
BUNKER_BUSTER_RADIUS=12 #Blast radius of the Bunker Buster once it stops burrowing | default: 12

