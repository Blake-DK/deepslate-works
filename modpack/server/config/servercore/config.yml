# ServerCore 1.5.19 (planner, 2026-10-01): ONLY entity activation range and the mob-cap features. Everything else
# is off or at the game's own values. Sync puts this file into the server's config/servercore/; ServerCore reads it
# at start and rewrites it with its own comments (`/servercore reload` reads it again, `/servercore status` shows it).
# Key names checked against the jar. If a key is wrong ServerCore logs it and falls back to its defaults, in which
# activation range is OFF: a mistake here makes it do nothing, never more.

features:
  prevent-moving-into-unloaded-chunks: false
  autosave-interval-seconds: 300
  xp-merge-fraction: 40
  xp-merge-radius: 0.5
  item-merge-radius: 0.5
  lobotomize-villagers: {enabled: false, tick-interval: 20}

# Dynamic performance OFF: the portal's own view/simulation distance sliders (Admin -> Server -> Settings) decide.
# default-values are applied even while dynamic is off, so they are kept neutral: mob caps at 100 %, and the
# chunk tick distance (which caps random ticks and spawning) at 32, above any simulation distance we allow (max 12).
# VIEW_DISTANCE and SIMULATION_DISTANCE are deliberately not listed: AMP's values stand.
dynamic:
  enabled: false
  target-mspt: 35
  default-values:
    MOBCAP_PERCENTAGE: 100
    CHUNK_TICK_DISTANCE: 32
  dynamic-settings: []

breeding-cap:
  enabled: false
  villagers: {limit: 32, range: 64, unlimited-height: false}
  animals: {limit: 32, range: 64, unlimited-height: false}

# Mob-cap features: mobs that the game normally lets spawn past the cap (zombie reinforcements, zombified piglins
# from portals, silverfish from Infested) count towards it. Monster spawners are left alone so spawner farms work.
# The categories are the game's own numbers.
mob-spawning:
  zombie-reinforcements: {enforce-mobcap: true, additional-capacity: 32}
  nether-portal-randomticks: {enforce-mobcap: true, additional-capacity: 32}
  monster-spawners: {enforce-mobcap: false, additional-capacity: 32}
  infested: {enforce-mobcap: true, additional-capacity: 32}
  categories:
    - {category: 'MONSTER', mobcap: 70, spawn-interval: 1, despawn-distance: 128}
    - {category: 'CREATURE', mobcap: 10, spawn-interval: 400, despawn-distance: 128}
    - {category: 'AMBIENT', mobcap: 15, spawn-interval: 1, despawn-distance: 128}
    - {category: 'AXOLOTLS', mobcap: 5, spawn-interval: 1, despawn-distance: 128}
    - {category: 'UNDERGROUND_WATER_CREATURE', mobcap: 5, spawn-interval: 1, despawn-distance: 128}
    - {category: 'WATER_CREATURE', mobcap: 5, spawn-interval: 1, despawn-distance: 128}
    - {category: 'WATER_AMBIENT', mobcap: 20, spawn-interval: 1, despawn-distance: 64}

commands:
  status-enabled: true
  mobcaps-enabled: true

# Activation range: mobs far from every player tick once a second instead of 20 times. The DEFAULT type has range
# 0, which ServerCore treats as "always active": anything that is not matched below as a mob (Create contraptions,
# trains and seats, TaCZ bullets, corpses, items, minecarts, boats, item frames) ticks normally, always
# (ServerCore issue #67: Create trains break otherwise). Modded entity ids are not listed on purpose: an unknown id
# makes ServerCore reject the file, and the config is read before mods register their entities.
activation-range:
  enabled: true
  tick-new-entities: true
  use-vertical-range: false
  skip-non-immune: false
  villager-tick-panic: true
  villager-work-immunity-after: 20
  villager-work-immunity-for: 20
  excluded-entity-types: ['minecraft:ghast', 'minecraft:hopper_minecart', 'minecraft:warden']
  default-activation-type: {activation-range: 0, tick-interval: 20, wakeup-interval: -1, extra-height-up: false, extra-height-down: false}
  custom-activation-types:
    - {name: raider, activation-range: 48, tick-interval: 20, wakeup-interval: 20, extra-height-up: true, extra-height-down: false, entity-matcher: ['typeof:raider']}
    - {name: water, activation-range: 16, tick-interval: 20, wakeup-interval: 60, extra-height-up: false, extra-height-down: false, entity-matcher: ['typeof:water_animal']}
    - {name: villager, activation-range: 16, tick-interval: 20, wakeup-interval: 30, extra-height-up: false, extra-height-down: false, entity-matcher: ['typeof:villager']}
    - {name: flying-monster, activation-range: 48, tick-interval: 20, wakeup-interval: 20, extra-height-up: true, extra-height-down: false, entity-matcher: ['minecraft:ghast', 'minecraft:phantom']}
    - {name: monster, activation-range: 32, tick-interval: 20, wakeup-interval: 20, extra-height-up: true, extra-height-down: false, entity-matcher: ['typeof:monster']}
    - {name: animal, activation-range: 16, tick-interval: 20, wakeup-interval: 60, extra-height-up: false, extra-height-down: false, entity-matcher: ['typeof:animal', 'typeof:ambient']}
    - {name: creature, activation-range: 24, tick-interval: 20, wakeup-interval: 30, extra-height-up: false, extra-height-down: false, entity-matcher: ['typeof:mob']}
