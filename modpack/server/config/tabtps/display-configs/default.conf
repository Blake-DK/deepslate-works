# Deepslate Works, docs/05 "Connection". Goes to the server with every sync.
# TabTPS shows what it measures, piece by piece ("modules": tps, mspt, players, ping, memory, cpu).
# It cannot show words of our own, and the ping it shows is the ping of whoever is looking.

# No permission needed: everyone gets this.
permission=""

tab-settings {
    allow=true
    # On for everyone from the moment they join; "/tabtps toggle tab" turns it off for oneself.
    enable-on-login=true
    # Above the player list: the server's speed and how many are on.
    header-modules="tps,players"
    # Below it: your own ping.
    footer-modules="ping"
    separator=" <gray>·</gray> "
    theme=default
}
