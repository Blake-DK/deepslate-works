# Open Parties and Claims 0.31.6: what every player starts with (planner, 2026-10-01). Only what differs from
# OPAC's defaults. Party members already share positions on the minimap and world map, at any distance; allied
# parties do too with these two. Party members have full access to each other's claims (OPAC's default).

[playerConfig]

	[playerConfig.parties]
		shareLocationWithParty = true
		receiveLocationsFromParty = true
		shareLocationWithMutualAllyParties = true
		receiveLocationsFromMutualAllyParties = true

	[playerConfig.claims]

		[playerConfig.claims.forceload]
			enabled = false
