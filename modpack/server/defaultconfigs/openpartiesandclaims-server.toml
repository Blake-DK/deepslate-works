# Open Parties and Claims 0.31.6, settings shipped with the pack (planner, 2026-10-01). Only what differs from
# OPAC's defaults is here; OPAC fills in the rest. NeoForge 21.1 keeps this server config in the instance's
# config/openpartiesandclaims-server.toml (not <world>/serverconfig/, which only holds OPAC's player configs) and
# copies this file there only when that file is missing. After that config/ counts: change it there, server stopped.

[serverConfig]

	[serverConfig.parties]
		enabled = true
		# hours of complete inactivity before a party is removed (90 days)
		partyExpirationTime = 2160

	[serverConfig.claims]
		enabled = true
		# chunks per player; claiming is optional
		maxPlayerClaims = 200
		# no forceloaded chunks: the server does not keep anybody's base running while they are away
		maxPlayerClaimForceloads = 0
		# hours a player can be away before their claims are freed (90 days)
		playerClaimsExpirationTime = 2160
		playerClaimsConvertExpiredClaims = false
		# nobody claims in the entrance room's dimension (the server claims the room itself)
		claimableDimensionsListType = "ALL_BUT"
		claimableDimensionsList = ["deepslate:limbo"]

		[serverConfig.claims.protection]
			# usable in every claim, including the spawn area: waystones and sharestones
			forcedBlockProtectionExceptionList = ["minecraft:crafting_table", "#waystones:waystones", "#waystones:sharestones"]
			# right-click a body (Corpse) in any claim, spawn included; Corpse's own rule still decides whose body opens.
			# Interaction only: no break$ prefix, so nobody can destroy a body. minecraft:minecart is OPAC's default.
			forcedEntityProtectionExceptionList = ["minecraft:minecart", "corpse:corpse"]
			# a backpack in your hand opens anywhere
			itemUseProtectionExceptionList = ["minecraft:firework_rocket", "sophisticatedbackpacks:backpack", "sophisticatedbackpacks:copper_backpack", "sophisticatedbackpacks:iron_backpack", "sophisticatedbackpacks:gold_backpack", "sophisticatedbackpacks:diamond_backpack", "sophisticatedbackpacks:netherite_backpack"]
